<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentos · PRISMA</title>
  <meta name="description" content="Repositório de documentos, laudos e atestados.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 6.5l8.2 4.75v9.5L16 25.5l-8.2-4.75v-9.5z' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">

  <!-- Estilos: globais + módulo da página -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/documentos.css">

  <!-- Tema salvo + proteção de rota: sem sessão → tela de login (antes de renderizar) -->
  <script>try{var p=JSON.parse(localStorage.getItem('prisma:prefs')||'{}');document.documentElement.dataset.theme=p.theme||'light';if(!sessionStorage.getItem('prisma:session')&&!localStorage.getItem('prisma:session')){location.replace('../pages/login.html?next=pages/documentos.html');}}catch(e){}</script>

  <!-- Scripts: núcleo global + módulo(s) da página -->
  <script src="../js/global.js" defer></script>
  <script src="../js/agenda.js" defer></script>
  <script src="../js/documentos.js" defer></script>
</head>
<body data-page="documentos" data-root="..">
  <div class="app">
    <!-- Sidebar / drawer: renderizada por global.js -->
    <aside id="sidebar" class="sidebar" aria-label="Menu lateral"></aside>

    <div class="main">
      <!-- Topbar (troca de perfil, notificações): renderizada por global.js -->
      <header id="topbar" class="topbar"></header>

      <main id="view" class="view">
        <!-- ============ Página modular: DOCUMENTOS ============ -->
        <div class="page-head">
          <div>
            <h1 class="h1">Documentos</h1>
            <p class="sub">Arquivos, avaliações, laudos e atestados com rastreabilidade de origem.</p>
          </div>
          <div class="row wrap">
            <button class="btn btn-outline" id="btn-emitir" hidden>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
              Emitir laudo / atestado
            </button>
            <button class="btn btn-dark" id="btn-upload">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              Enviar documento
            </button>
          </div>
        </div>

        <!-- Status da integração com o Google Drive (R01 / CT01) -->
        <section class="card drive-card" id="drive-card" aria-live="polite"></section>

        <div class="tabs" role="tablist">
          <button class="tab active" data-aba="docs" role="tab">Repositório</button>
          <button class="tab" data-aba="laudos" role="tab">Laudos e atestados <span class="count" id="laudo-count">0</span></button>
        </div>

        <!-- Aba: Repositório -->
        <section id="painel-docs">
          <div class="doc-toolbar">
            <div class="search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input class="input" id="doc-busca" type="search" placeholder="Buscar documentos…" aria-label="Buscar documentos">
            </div>
            <select class="select" id="doc-paciente" aria-label="Filtrar por paciente" hidden></select>
          </div>
          <div class="chips mt-12" id="doc-chips" role="toolbar" aria-label="Categorias"></div>

          <div class="dropzone" id="dropzone">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Arraste arquivos aqui ou <label>clique para selecionar<input type="file" id="dz-input" class="sr-only"></label>
          </div>

          <div class="card">
            <div class="card-head"><h3>Documentos recentes</h3><span class="text-xs text-muted" id="doc-count"></span></div>
            <div id="doc-list"></div>
          </div>
        </section>

        <!-- Aba: Laudos e atestados -->
        <section id="painel-laudos" hidden>
          <div class="card">
            <div class="card-head"><h3>Laudos e atestados emitidos</h3><span class="text-xs text-muted">Vinculados a consultas realizadas</span></div>
            <div id="laudo-list"></div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <noscript><p style="padding:24px">O PRISMA precisa de JavaScript habilitado.</p></noscript>
</body>
</html>
