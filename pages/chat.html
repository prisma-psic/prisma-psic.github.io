<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat · PRISMA</title>
  <meta name="description" content="Central de mensagens entre psicóloga e pacientes.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 6.5l8.2 4.75v9.5L16 25.5l-8.2-4.75v-9.5z' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">

  <!-- Estilos: globais + módulo da página -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/chat.css">

  <!-- Tema salvo + proteção de rota: sem sessão → tela de login (antes de renderizar) -->
  <script>try{var p=JSON.parse(localStorage.getItem('prisma:prefs')||'{}');document.documentElement.dataset.theme=p.theme||'light';if(!sessionStorage.getItem('prisma:session')&&!localStorage.getItem('prisma:session')){location.replace('../pages/login.html?next=pages/chat.html');}}catch(e){}</script>

  <!-- Scripts: núcleo global + módulo(s) da página -->
  <script src="../js/global.js" defer></script>
  <script src="../js/agenda.js" defer></script>
  <script src="../js/chat.js" defer></script>
</head>
<body data-page="chat" data-root="..">
  <div class="app">
    <!-- Sidebar / drawer: renderizada por global.js -->
    <aside id="sidebar" class="sidebar" aria-label="Menu lateral"></aside>

    <div class="main">
      <!-- Topbar (troca de perfil, notificações): renderizada por global.js -->
      <header id="topbar" class="topbar"></header>

      <main id="view" class="view">
        <!-- ============ Página modular: CHAT ============ -->
        <div class="page-head chat-head-page">
          <div>
            <h1 class="h1">Chat</h1>
            <p class="sub">Comunicação administrativa e orientações entre sessões.</p>
          </div>
        </div>

        <div class="chat-layout">
          <!-- Conversas -->
          <section class="card chat-list" aria-label="Conversas">
            <div class="card-head">
              <h3>Conversas</h3>
              <div class="search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input class="input" id="chat-busca" type="search" placeholder="Buscar contato…" aria-label="Buscar contato">
              </div>
            </div>
            <div id="chat-conversas"></div>
          </section>

          <!-- Conversa ativa -->
          <section class="card chat-main" aria-label="Mensagens">
            <div id="chat-head"></div>
            <div id="chat-thread" aria-live="polite"></div>
            <form id="chat-form" autocomplete="off">
              <div class="composer">
                <textarea id="chat-input" rows="1" maxlength="600" placeholder="Escreva uma mensagem…" aria-label="Mensagem"></textarea>
                <button id="chat-send" type="submit" aria-label="Enviar">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
              </div>
              <div class="composer-foot">
                <span>🔒 Comunicação segura e confidencial · CFP &amp; LGPD · Enter envia, Shift+Enter quebra linha</span>
                <span id="chat-counter">0/500</span>
              </div>
            </form>
          </section>
        </div>
      </main>
    </div>
  </div>
  <noscript><p style="padding:24px">O PRISMA precisa de JavaScript habilitado.</p></noscript>
</body>
</html>
