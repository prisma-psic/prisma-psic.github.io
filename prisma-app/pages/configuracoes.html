<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurações · PRISMA</title>
  <meta name="description" content="Perfil, regras da agenda, preferências e dados do PRISMA.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 6.5l8.2 4.75v9.5L16 25.5l-8.2-4.75v-9.5z' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">

  <!-- Estilos: globais + módulo da página -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/configuracoes.css">

  <!-- Tema salvo + proteção de rota: sem sessão → tela de login (antes de renderizar) -->
  <script>try{var p=JSON.parse(localStorage.getItem('prisma:prefs')||'{}');document.documentElement.dataset.theme=p.theme||'light';if(!sessionStorage.getItem('prisma:session')&&!localStorage.getItem('prisma:session')){location.replace('../pages/login.html?next=pages/configuracoes.html');}}catch(e){}</script>

  <!-- Scripts: núcleo global + módulo(s) da página -->
  <script src="../js/global.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/agenda.js" defer></script>
  <script src="../js/configuracoes.js" defer></script>
</head>
<body data-page="configuracoes" data-root="..">
  <div class="app">
    <!-- Sidebar / drawer: renderizada por global.js -->
    <aside id="sidebar" class="sidebar" aria-label="Menu lateral"></aside>

    <div class="main">
      <!-- Topbar (troca de perfil, notificações): renderizada por global.js -->
      <header id="topbar" class="topbar"></header>

      <main id="view" class="view">
        <!-- ============ Página modular: CONFIGURAÇÕES ============ -->
        <div class="page-head">
          <div>
            <h1 class="h1">Configurações</h1>
            <p class="sub">Perfil, regras da agenda, preferências e privacidade.</p>
          </div>
        </div>

        <div class="cfg-layout">
          <nav id="cfg-menu" aria-label="Seções de configuração"></nav>
          <section class="card" id="cfg-panel" aria-live="polite"></section>
        </div>
      </main>
    </div>
  </div>
  <noscript><p style="padding:24px">O PRISMA precisa de JavaScript habilitado.</p></noscript>
</body>
</html>
