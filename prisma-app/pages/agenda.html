<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda · PRISMA</title>
  <meta name="description" content="Agenda de consultas do PRISMA: solicitações, confirmações, remarcações e cancelamentos.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 6.5l8.2 4.75v9.5L16 25.5l-8.2-4.75v-9.5z' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">

  <!-- Estilos: globais + módulo da página -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/agenda.css">

  <!-- Tema salvo + proteção de rota: sem sessão → tela de login (antes de renderizar) -->
  <script>try{var p=JSON.parse(localStorage.getItem('prisma:prefs')||'{}');document.documentElement.dataset.theme=p.theme||'light';if(!sessionStorage.getItem('prisma:session')&&!localStorage.getItem('prisma:session')){location.replace('../pages/login.html?next=pages/agenda.html');}}catch(e){}</script>

  <!-- Scripts: núcleo global + módulo(s) da página -->
  <script src="../js/global.js" defer></script>
  <script src="../js/agenda.js" defer></script>
</head>
<body data-page="agenda" data-root="..">
  <div class="app">
    <!-- Sidebar / drawer: renderizada por global.js -->
    <aside id="sidebar" class="sidebar" aria-label="Menu lateral"></aside>

    <div class="main">
      <!-- Topbar (troca de perfil, notificações): renderizada por global.js -->
      <header id="topbar" class="topbar"></header>

      <main id="view" class="view">
        <!-- ============ Página modular: AGENDA ============ -->
        <div class="page-head">
          <div>
            <h1 class="h1">Agenda</h1>
            <p class="sub" id="agenda-sub">Gerencie solicitações, confirmações e comparecimentos.</p>
          </div>
          <button class="btn btn-dark" id="btn-solicitar" hidden>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Solicitar consulta
          </button>
        </div>

        <div class="alert alert-info mb-16" id="agenda-role-note"></div>

        <div class="agenda-layout">
          <!-- Coluna lateral: calendário, resumo e regras -->
          <aside class="agenda-side">
            <section class="card card-pad" aria-label="Calendário">
              <div class="cal-head">
                <button class="icon-btn sm" id="cal-prev" aria-label="Mês anterior"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
                <strong id="cal-title">—</strong>
                <button class="icon-btn sm" id="cal-next" aria-label="Próximo mês"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
              </div>
              <div class="cal-week"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
              <div class="cal-grid" id="cal-grid"></div>
              <div class="cal-legend">
                <span><i style="background:var(--ink)"></i>Selecionado</span>
                <span><i style="background:var(--primary-soft);border:1px solid var(--primary)"></i>Com consulta</span>
                <span><i class="lg-bloqueado"></i>Bloqueado</span>
                <button class="btn btn-ghost btn-sm" id="cal-today" style="margin-left:auto">Hoje</button>
              </div>
            </section>

            <section class="card card-pad" aria-label="Resumo do mês">
              <h3 class="h3 mb-12">Resumo do mês</h3>
              <div id="resumo-mes"></div>
            </section>

            <!-- Bloqueio de dias/horários (somente psicóloga) -->
            <section class="card card-pad" id="bloqueios-card" aria-labelledby="bloqueios-titulo" hidden>
              <div class="row-between mb-12">
                <h3 class="h3" id="bloqueios-titulo">Bloqueio de dias/horários</h3>
                <button class="btn btn-dark btn-sm" id="btn-bloquear">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  Bloquear
                </button>
              </div>
              <p class="text-xs text-muted mb-12">Folgas, feriados, congressos… Os pacientes veem esses dias como indisponíveis.</p>
              <div class="blk-list" id="bloqueios-lista"></div>
              <button class="btn btn-ghost btn-sm mt-8" id="bloqueios-passados">Ver anteriores</button>
            </section>

            <section class="card card-pad" aria-label="Regras da agenda">
              <h3 class="h3 mb-12">Regras da agenda</h3>
              <ul class="rules-list" id="regras-lista"></ul>
            </section>
          </aside>

          <!-- Coluna principal: lista de consultas -->
          <section class="card agenda-main" aria-labelledby="list-title">
            <div class="card-head">
              <div>
                <h3 id="list-title">Próximas consultas</h3>
                <div class="text-xs text-muted" id="list-sub"></div>
              </div>
              <div class="chips" id="agenda-filtros" role="toolbar" aria-label="Filtros"></div>
            </div>
            <div id="agenda-list"></div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <noscript><p style="padding:24px">O PRISMA precisa de JavaScript habilitado.</p></noscript>
</body>
</html>
